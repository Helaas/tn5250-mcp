[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 license fields
build-backend = "hatchling.build"

[project]
name = "tn5250-mcp"
version = "0.2.0"
description = "MCP server that drives IBM i (AS/400) 5250 sessions, with a live web viewer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kevin Vranken"}]
requires-python = ">=3.11"
keywords = ["ibm-i", "as400", "5250", "tn5250", "mcp", "rpg", "db2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Terminals :: Telnet",
]
dependencies = ["mcp>=2.3,<3", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/Helaas/tn5250-mcp"
Issues = "https://github.com/Helaas/tn5250-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
# a Java runtime for the SQL/IFS tools, for machines without one (OpenJDK, GPLv2+CE)
java = ["jdk4py>=21"]
# "Remember on this computer": passwords in the system keychain
keyring = ["keyring>=24"]

[project.scripts]
tn5250-mcp = "tn5250_mcp.server:main"
tn5250-run = "tn5250_mcp.cli:main"

[project.entry-points.pytest11]
tn5250 = "tn5250_mcp.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/tn5250_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
