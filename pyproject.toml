[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tn5250-mcp"
version = "0.2.0"
description = "MCP server that drives IBM i (AS/400) 5250 sessions, with a live web viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tn5250-mcp = "tn5250_mcp.server:main"
tn5250-run = "tn5250_mcp.cli:main"

[project.entry-points.pytest11]
tn5250 = "tn5250_mcp.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/tn5250_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
