# General IBM i flows. signon starts on the sign-on screen; the others start and
# end on the IBM i Main Menu.

toolset: ibmi
flows:
  signon:
    description: >-
      Sign on at the sign-on screen as the given user. The user types the
      password in the viewer (or it comes from $T5250_PASSWORD when nobody is
      watching). Ends on the first screen after sign-on, usually a menu.
    params:
      user: {type: string, upper: true, pattern: '^[A-Z$#@][A-Z0-9$#@_]{0,9}$',
             description: "user profile"}
      password: {type: secret, env: T5250_PASSWORD, prompt: "IBM i password"}
    steps:
      - name: sign on
        expect: "Password"                    # works for custom sign-on screens too
        fill: {User: "{user}", Password: "{password}"}
        press: Enter
        timeout: 60
        check: {keyboard: any}
      - name: refused
        when: "Password"
        fail: "sign-on was refused; the sign-on screen is still showing (see its message line)"
      - name: program messages
        when: "Display Program Messages"
        press: Enter
      - name: press enter to continue
        when: "Press Enter to continue"
        press: Enter

  run_command:
    description: >-
      Run a CL command from the IBM i Main Menu command line, for commands that
      don't open a screen of their own. Fails on an error message.
    # A free-form command line would undo the point of a flows-only server,
    # so this is a helper for other flows, not a tool.
    expose: false
    params:
      command: {type: string, min_length: 1, max_length: 153, description: "CL command"}
    steps:
      - expect: "IBM i Main Menu"
        fill: {"Selection or command": "{command}"}
        press: Enter
        timeout: 120
        check: {text: "IBM i Main Menu"}
        capture: {message: '\n([^\n]*)\Z'}     # message line (last row)

  sql_select:
    description: >-
      Run one SELECT (or WITH) statement in interactive SQL (STRSQL) and return
      the first page of the result. Returns `result`: the result rows as shown.
    read_only: true
    params:
      statement:
        type: string
        max_length: 1000
        # one statement, a query only (QCMDEXC is refused by the block list)
        pattern: '^\s*(SELECT|select|Select|WITH|with|With)\s[^;]*$'
        description: "SELECT ... statement; no trailing semicolon"
    steps:
      - name: start STRSQL
        expect: "IBM i Main Menu"
        fill: {"Selection or command": "STRSQL"}
        press: Enter
        check: {text: "Enter SQL Statements"}
      - name: run the query
        expect: "Enter SQL Statements"
        fill: {"@cursor": "{statement}"}       # STRSQL puts the cursor on its input line
        press: Enter
        timeout: 120
        check: {text: "Display Data"}
        capture: {result: {rows: "3-22"}}
      - name: back to the statement screen
        expect: "Display Data"
        press: F3
        check: {text: "Enter SQL Statements"}
      - name: leave STRSQL
        expect: "Enter SQL Statements"
        press: F3
        check: {text: "Exit Interactive SQL"}
      - name: save session and exit
        expect: "Exit Interactive SQL"
        press: Enter
        check: {text: "IBM i Main Menu"}
